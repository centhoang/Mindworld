<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Look compare</title>
    <style>
      html, body { height: 100%; margin: 0; background: #3b2c35; overflow: hidden; font: 14px/1 system-ui, sans-serif; }
      iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; }
      body[data-show="a"] #a, body[data-show="b"] #b { visibility: visible; }
      body[data-show="both"] iframe { visibility: visible; width: 50%; }
      body[data-show="both"] #b { left: 50%; }
      #bar { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 1; display: flex; gap: 4px; padding: 4px; border-radius: 8px; background: #3b2c35e0; }
      button { font: inherit; padding: 6px 12px; min-height: 32px; border: 0; border-radius: 5px; background: transparent; color: #fbf0d4; cursor: pointer; }
      button[aria-pressed="true"] { background: #fbf0d4; color: #3b2c35; }
    </style>
  </head>
  <body data-show="b">
    <iframe id="a" title="Current glyph look" src="/glyph-spike.html"></iframe>
    <iframe id="b" title="Mosaic cell plane" src="/mosaic-spike.html"></iframe>
    <div id="bar" role="group" aria-label="Which version">
      <button data-v="a">A current</button>
      <button data-v="b" data-s="1">Tile</button>
      <button data-v="b" data-s="2">Dense</button>
      <button data-v="b" data-s="3">Night</button>
      <button data-v="b" data-s="4">Sketch</button>
      <button data-v="b" data-s="5">Stitch</button>
      <button data-v="b" data-s="6">Soft</button>
      <button data-v="both">Side by side</button>
    </div>
    <script type="module">
      const buttons = [...document.querySelectorAll("button")];
      const b = document.getElementById("b");
      let skin = "1";
      const show = (v, s = skin) => {
        skin = s;
        document.body.dataset.show = v;
        buttons.forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.v === v && (v !== "b" || x.dataset.s === skin))));
        document.getElementById("a").contentWindow?.location.reload();
        b.src = `/mosaic-spike.html?v=${skin}`;
      };
      buttons.forEach((x) => x.addEventListener("click", () => show(x.dataset.v, x.dataset.s)));
      buttons[1].setAttribute("aria-pressed", "true");
      // Tab flips A and B, inside the frame too.
      const flip = (e) => { if (e.key === "Tab") { e.preventDefault(); show(document.body.dataset.show === "a" ? "b" : "a"); } };
      addEventListener("keydown", flip);
      b.addEventListener("load", () => { b.contentWindow.addEventListener("keydown", flip); b.focus(); });
    </script>
  </body>
</html>
