<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindworld</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #08080c; overflow: hidden; }
      #screen { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; }
      #crt { position: fixed; right: 10px; bottom: 10px; font: 10px "Press Start 2P", monospace; color: #f7dfc8; background: #45301f;
        border: 2px solid #c58757; padding: 6px 8px; cursor: pointer; opacity: 0.8; }
      #crt:hover { opacity: 1; }
      #teach { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(92vw, 760px); display: flex; gap: 6px; flex-wrap: wrap;
        font: 11px "Press Start 2P", monospace; }
      #teach[hidden], #chat[hidden] { display: none; }
      #chat { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(92vw, 640px); display: flex; gap: 6px;
        font: 11px "Press Start 2P", monospace; }
      #chat input { flex: 1 1 auto; font: inherit; padding: 9px 10px; color: #39463F; background: #FFF3D8; border: 3px solid #795849; outline: none; }
      #chat button { font: inherit; padding: 8px 10px; color: #FFF3D8; background: #A57954; border: 3px solid #795849; cursor: pointer; }
      #teach input { flex: 1 1 260px; font: inherit; padding: 9px 10px; color: #141820; background: #f7dfc8; border: 3px solid #45301f; outline: none; }
      #teach input:focus { border-color: #a85f2a; }
      #teach button { font: inherit; padding: 8px 10px; color: #f7dfc8; background: #a85f2a; border: 3px solid #45301f; cursor: pointer; }
      #teach button[data-act=close] { background: #7a4628; }
      #teach button:disabled, #teach input:disabled { opacity: 0.55; cursor: default; }
      #setup { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: #08080c; font: 11px/1.9 "Press Start 2P", monospace; color: #FFF3D8; z-index: 2; }
      #setup[hidden], #setup [hidden] { display: none; }
      #setup section { width: min(100%, 620px); padding: 18px; background: #39463F; border: 3px solid #795849; box-sizing: border-box; }
      #setup h1 { margin: 0 0 12px; font: inherit; font-size: 14px; }
      #setup p { margin: 0 0 14px; white-space: pre-line; }
      #setup [data-bar] { height: 14px; margin-bottom: 14px; background: #FFF3D8; border: 3px solid #795849; }
      #setup [data-fill] { height: 100%; width: 0; background: #A57954; }
      #setup [data-buttons] { display: flex; flex-wrap: wrap; gap: 8px; }
      #setup button { font: inherit; padding: 8px 10px; color: #FFF3D8; background: #A57954; border: 3px solid #795849; cursor: pointer; }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <form id="teach" hidden autocomplete="off">
      <input maxlength="300" placeholder="e.g. guard when it winds up a heavy hit" aria-label="Teach your pet" />
      <button type="submit">Teach</button>
      <button type="button" data-act="speak" hidden>Speak</button>
      <button type="button" data-act="review">Review fights</button>
      <button type="button" data-act="close">Close</button>
    </form>
    <form id="chat" hidden autocomplete="off">
      <input maxlength="140" placeholder="Say something..." aria-label="Talk" />
      <button type="submit">Say</button>
      <button type="button" data-act="close">Bye</button>
    </form>
    <button id="crt" type="button">CRT on</button>
    <div id="setup" hidden>
      <section>
        <h1>Mindworld</h1>
        <p></p>
        <div data-bar hidden><div data-fill></div></div>
        <div data-buttons></div>
      </section>
    </div>
    <script type="module" src="/src/pixel/main.ts"></script>
  </body>
</html>
