name = "pet-mind"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# One Worker serves the built client AND the API, so the geo-block covers every request.
# Build the client first (`npm run build` in ../client). The custom domain below makes Cloudflare create
# the DNS record for pets.uryto.dev on deploy (approved by the user 2026-10-28).
routes = [{ pattern = "pets.uryto.dev", custom_domain = true }]

[assets]
directory = "../client/dist"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "SPEND"
class_name = "SpendCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpendCounter"]

# Ghost snapshots (traits + memo). `wrangler deploy` provisions this namespace automatically;
# local dev uses a local simulation. Eventual consistency is fine for ghosts.
[[kv_namespaces]]
binding = "GHOSTS"

# Non-secret defaults. Secrets (BASETEN_API_KEY, META_API_KEY, MODAL_PROXY_TOKEN) come from `.env` in local dev
# (`npm run dev` passes --env-file ../.env) and from `wrangler secret put` in production.
# Set MODAL_BASE_URL and MODAL_GLIMMER_URL when available; omitted URLs disable those providers.
[vars]
LLM_MOCK = "0"
MAX_DAILY_USD = "5"
MAX_TOTAL_USD_BASETEN = "50"
MAX_TOTAL_USD_META = "100"
MAX_TOTAL_USD_MODAL = "20"
MAX_TOTAL_USD_GLIMMER = "30"
CLIENT_DAILY_USD = "0.4"
CLIENT_PER_MINUTE = "10"
BASETEN_BASE_URL = "https://inference.baseten.co/v1"
BASETEN_MODEL = "meta-models/muse-spark-open-1026"
META_MODEL = "muse-spark-1.3"
MODAL_MODEL = "meta-models/Muse-Spark-Open-816B-A42B"
MODAL_GLIMMER_MODEL = "glimmer"
